apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}-redis
spec:
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "aerocompliance-pro.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "aerocompliance-pro.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "{{ .Values.redis.resources.requests.memory }}"
              cpu: "{{ .Values.redis.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.redis.resources.limits.memory }}"
              cpu: "{{ .Values.redis.resources.limits.cpu }}"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}-redis
spec:
  selector:
    app: {{ include "aerocompliance-pro.fullname" . }}-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
