apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "{{ .Values.postgres.storage.size }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}-postgres
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "aerocompliance-pro.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "aerocompliance-pro.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "aerocompliance-pro.fullname" . }}-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "{{ .Values.postgres.resources.requests.memory }}"
              cpu: "{{ .Values.postgres.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.postgres.resources.limits.memory }}"
              cpu: "{{ .Values.postgres.resources.limits.cpu }}"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "aerocompliance-pro.fullname" . }}-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}-postgres
spec:
  selector:
    app: {{ include "aerocompliance-pro.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
