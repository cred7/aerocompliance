{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range .Values.ingress.rules }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "aerocompliance-pro.fullname" $ }}-{{ .service }}-service
                port:
                  number: {{ .port }}
          {{- end }}
{{- end }}
