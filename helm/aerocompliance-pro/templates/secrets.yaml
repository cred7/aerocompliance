apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "{{ .Values.secrets.djangoSecretKey }}"
  POSTGRES_PASSWORD: "{{ .Values.secrets.postgresPassword }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aerocompliance-pro.fullname" . }}-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: "{{ .Values.postgres.secret.db }}"
  POSTGRES_USER: "{{ .Values.postgres.secret.user }}"
  POSTGRES_PASSWORD: "{{ .Values.postgres.secret.password }}"
