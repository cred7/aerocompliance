  db:
    image: postgres:16

    container_name: aerocompliance_db

    restart: always

    environment:
      POSTGRES_DB: aerocompliance
      POSTGRES_USER: aerocompliance
      POSTGRES_PASSWORD: aerocompliance
    ports:
      - "5555:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: aerocompliance_redis

    ports:
      - "6666:6379"

