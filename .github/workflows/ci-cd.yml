name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE_NAME: aerocompliance-backend
  FRONTEND_IMAGE_NAME: aerocompliance-frontend

jobs:
  # ============================================================================
  # CI JOBS - Build and Test
  # ============================================================================

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/base.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: Run linting
        working-directory: backend
        run: |
          pip install flake8 black
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # - name: Run tests
      #   working-directory: backend
      #   env:
      #     DEBUG: False
      #     SECRET_KEY: test-secret-key
      #     ALLOWED_HOSTS: localhost
      #     DATABASE_URL: "sqlite:///:memory:"
      #   run: python manage.py test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # - name: Run linting
      #   working-directory: frontend
      #   run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # BUILD DOCKER IMAGES (only on push to main/develop, not on PR)
  # ============================================================================

  build-docker-images:
    name: Build Docker Images
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug - Verify secrets and variables
        run: |
          echo "=== Environment Variables ==="
          echo "REGISTRY: ${{ env.REGISTRY }}"
          echo "BACKEND_IMAGE_NAME: ${{ env.BACKEND_IMAGE_NAME }}"
          echo "FRONTEND_IMAGE_NAME: ${{ env.FRONTEND_IMAGE_NAME }}"
          echo ""
          echo "=== Secrets Check (redacted) ==="
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is EMPTY or NOT SET"
          else
            echo "✓ DOCKERHUB_USERNAME is set (length: ${{ secrets.DOCKERHUB_USERNAME }} chars)"
          fi
          if [ -z "${{ secrets.DOCKERHUB_PASSWORD }}" ]; then
            echo "ERROR: DOCKERHUB_PASSWORD is EMPTY or NOT SET"
          else
            echo "✓ DOCKERHUB_PASSWORD is set"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # DEPLOYMENT JOBS (GitHub-managed deployment steps)
  # ============================================================================

  deploy-dev:
    name: Deploy to Dev
    needs: build-docker-images
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          echo "Replace this with your deployment command for dev."
          echo "Image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"

      - name: Deploy frontend
        run: |
          echo "Replace this with your deployment command for dev."
          echo "Image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}"

  deploy-staging:
    name: Deploy to Staging
    needs: build-docker-images
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          echo "Replace this with your deployment command for staging."
          echo "Image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"

      - name: Deploy frontend
        run: |
          echo "Replace this with your deployment command for staging."
          echo "Image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    needs: build-docker-images
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          echo "Replace this with your deployment command for production."
          echo "Image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"

      - name: Deploy frontend
        run: |
          echo "Replace this with your deployment command for production."
          echo "Image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}"
