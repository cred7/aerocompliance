apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerocompliance-pro-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerocompliance-pro-beat
  template:
    metadata:
      labels:
        app: aerocompliance-pro-beat
    spec:
      containers:
        - name: beat
          image: aerocompliance_backend:v1.0
          imagePullPolicy: IfNotPresent

          command:
            - celery
            - -A
            - config
            - beat
            - --loglevel=info

          envFrom:
            - secretRef:
                name: aerocompliance-pro-secrets

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
