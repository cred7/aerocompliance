apiVersion: apps/v1
kind: Deployment

metadata:
  name: aerocompliance-pro-frontend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: aerocompliance-pro-frontend

  template:
    metadata:
      labels:
        app: aerocompliance-pro-frontend

    spec:
      containers:
        - name: aerocompliance-pro-frontend

          image: aerocompliance_frontend:v1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: aerocompliance-pro-config

            - secretRef:
                name: aerocompliance-pro-secrets
---
apiVersion: v1
kind: Service

metadata:
  name: aerocompliance-pro-frontend-service

spec:
  selector:
    app: aerocompliance-pro-frontend

  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
